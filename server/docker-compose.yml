services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_tracker
      POSTGRES_PASSWORD: gym_tracker
      POSTGRES_DB: gym_tracker
    ports:
      - "5432:5432"
    volumes:
      - gym_tracker_postgres:/var/lib/postgresql/data

volumes:
  gym_tracker_postgres:
